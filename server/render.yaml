services:
  - type: web
    name: acreage-api
    runtime: python
    build:
      buildCommand: |
        pip install -r requirements.txt
        python -m flask db upgrade
      startCommand: gunicorn -k gevent --workers 4 --worker-connections 1000 "app:create_app()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acreage-db
          property: connectionString
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://acreage-frontend.vercel.app,http://localhost:5173,http://localhost:3000
      - key: FRONTEND_URL
        value: https://acreage-frontend.vercel.app
      - key: MPESA_CALLBACK_URL
        value: https://acreage-n2h1.onrender.com/api/orders/mpesa-callback
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
    healthCheck:
      path: /health
    databases:
      - name: acreage-db
        region: oregon
        plan: free
