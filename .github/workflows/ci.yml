name: Acreage CI Pipeline

# Universal triggers: forces the pipeline to fire on every push, pull request, or manual button click
on: [push, pull_request, workflow_dispatch]

jobs:
  # --- BACKEND VERIFICATION JOB ---
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Flask Dependencies
        run: |
          cd server
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify Flask Compilation & Syntax
        run: |
          cd server
          # Python syntax errors or undefined names are treated as build failures
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  # --- FRONTEND VERIFICATION JOB ---
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Fixed: Matches the standard npm engine tracker
          cache-dependency-path: client/package-lock.json # FIXED: Corrected the filename typo

      - name: Install React Dependencies
        run: |
          cd client
          npm ci

      - name: Verify Frontend Production Build
        run: |
          cd client
          npm run build
